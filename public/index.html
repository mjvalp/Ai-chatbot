<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit</title>
  <meta name="description" content="Orbit is a friendly general-purpose AI chatbot.">
  <meta name="theme-color" content="#17181b">
  <link rel="icon" href="assets/robot.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem('orbit-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#composer-input">Skip to message box</a>
  <div class="app">
    <aside class="scene" aria-label="Orbit the robot">
      <div class="brand">
        <span class="label">// AI CHATBOT</span>
        <h1>ORBIT<span class="dot">.</span></h1>
      </div>
      <div class="stage">
        <img class="robot" src="assets/robot.png" alt="Orbit, a pixel-art robot waving hello" width="700" height="958">
        <div class="bubble" role="note">Hey, I’m Orbit. What’s on your mind?</div>
      </div>
      <p class="label foot">POWERED BY GROQ</p>
    </aside>

    <main class="chat" aria-label="Chat with Orbit">
      <header class="chat-head">
        <span class="label"><span class="status" aria-hidden="true"></span>ORBIT / ONLINE</span>
        <div class="actions">
          <button type="button" id="new-chat" class="btn">New chat</button>
          <button type="button" id="theme-toggle" class="btn icon" aria-label="Switch to light theme" title="Toggle theme">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1C13 3 12.5 3 12 3z"/></svg>
          </button>
        </div>
      </header>

      <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Conversation">
        <div id="suggestions" class="suggestions">
          <p class="label">TRY ASKING</p>
          <div class="chips">
            <button type="button" class="chip">Explain how black holes work like I’m 12</button>
            <button type="button" class="chip">Brainstorm 5 names for a podcast about cooking</button>
            <button type="button" class="chip">Write a friendly email asking for a deadline extension</button>
            <button type="button" class="chip">What are some tips for learning a new language?</button>
          </div>
        </div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <label for="composer-input" class="sr-only">Message Orbit</label>
        <textarea id="composer-input" rows="1" maxlength="2000" placeholder="Message Orbit…" enterkeyhint="send"></textarea>
        <button type="submit" id="send" class="send" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 20.5v-6.8l9-1.7-9-1.7V3.5l19 8.5z"/></svg>
        </button>
        <p class="hint label"><span id="counter">0 / 2000</span><span class="keys">ENTER to send · SHIFT+ENTER for a new line</span></p>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
